    <!-- Extension compatibility safeguard for window.fetch -->
    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return originalFetch;
            },
            set: function(newFetch) {
              originalFetch = newFetch;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // ignore if already non-configurable
        }

        // Suppress unhandled errors from external browser extensions
        window.addEventListener('error', function(event) {
          if (event && event.filename && event.filename.startsWith('chrome-extension://')) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
      })();
    </script>
